[project]
channels = ["nvidia/label/cuda-12.4.0", "nvidia", "conda-forge", "pytorch"]
description = "Add a short description here"
name = "DreamScene360"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
cuda = {version = "*", channel="nvidia/label/cuda-12.4.0"}
pytorch = {version = "2.4.0.*", channel="pytorch"}
torchvision = {version = "0.19.0.*", channel="pytorch"}
torchaudio = {version = "2.4.0.*", channel="pytorch"}
pytorch-cuda = {version = "12.4.*", channel="pytorch"}
python = "3.8.*"
setuptools = "*"
ninja = ">=1.12.1,<2"
pip = ">=24.3.1,<25"
libxcrypt = ">=4.4.36,<5"
gxx = "9.5.0.*"
datasets = ">=3.0.2,<4"
plyfile = ">=1.1,<2"
tqdm = ">=4.67.1,<5"
timm = ">=1.0.11,<2"
opencv = ">=4.10.0,<5"
torchmetrics = ">=1.5.2,<2"
trimesh = ">=4.5.3,<5"
h5py = ">=3.11.0,<4"
scipy = ">=1.10.1,<2"
kornia = "0.7.3.*"
matplotlib = ">=3.7.3,<4"
accelerate = ">=1.0.1,<2"
toml = ">=0.10.2,<0.11"
albumentations = ">=1.3.1,<2"
einops = ">=0.8.0,<0.9"
wget = ">=1.21.4,<2"
diffusers = "==0.10.2"
transformers = "==4.26.0"
omegaconf = ">=2.3.0,<3"
openai-clip = ">=1.0.1,<2"
lpips = ">=0.1.3,<0.2"
pytorch-msssim = ">=1.0.0,<2"

[pypi-options]
no-build-isolation = ["diff-gaussian-rasterization", "simple-knn"]

[pypi-dependencies]
diff-gaussian-rasterization = {path = "submodules/diff-gaussian-rasterization-depth"}
simple-knn = {path = "submodules/simple-knn"}
prefetch_generator = "*"
pytorch-lightning = "~=1.9.5"

[tasks]
# || operator in pixi allows running a command after only if the command before || fails
tcnn-install = "python -c 'import tinycudann as tcnn' || LIBRARY_PATH=$CONDA_PREFIX/lib/stubs:$LIBRARY_PATH proxychains4 python -m pip install ninja git+https://github.com/NVlabs/tiny-cuda-nn/#subdirectory=bindings/torch"
