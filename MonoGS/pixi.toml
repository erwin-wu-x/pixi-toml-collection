[workspace]
channels = ["pytorch", "conda-forge"]
name = "MonoGS"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
cudatoolkit = "11.6.*"
plyfile = "0.8.1.*"
python = "3.7.13.*"
pip = "22.3.1.*"
pytorch = "1.12.1.*"
torchaudio = "0.12.1.*"
torchvision = "0.13.1.*"
tqdm = "*"
mkl = "==2024.0"

[pypi-options]
no-build-isolation = ["diff-gaussian-rasterization", "simple-knn"]

[pypi-dependencies]
diff-gaussian-rasterization = {path = "submodules/diff-gaussian-rasterization"}
simple-knn = {path = "submodules/simple-knn"}
opencv-python = "==4.8.1.78"
munch = "*"
trimesh = "*"
evo = "==1.11.0"
open3d = "==0.17.0"
torchmetrics = "*"
imgviz = "*"
pyopengl = "*"
glfw = "*"
pyglm = "*"
wandb = "*"
lpips = "*"
rich = "*"
ruff = "*"
