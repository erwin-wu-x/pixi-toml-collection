[workspace]
authors = ["Erwin Wu <wsxerwin@gmail.com>"]
channels = ["nvidia/label/cuda-11.8.0", "nvidia", "conda-forge", "pytorch", "pyg"]
name = "HorizonGS"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
cuda = {version = "*", channel="nvidia/label/cuda-11.8.0"}
pytorch = {version = "2.1.2.*", channel="pytorch"}
torchvision = {version = "0.16.2.*", channel="pytorch"}
torchaudio = {version = "2.1.2.*", channel="pytorch"}
pytorch-cuda = {version = "11.8.*", channel="pytorch"}
python = "==3.8.19"
pip = "==24.2" 
pytorch-scatter = "*"
glm = ">=1.0.1,<2"
compilers = "==1.3.0"
shapely = ">=2.0.6,<3"
imageio = ">=2.36.0,<3"

[pypi-options]
no-build-isolation = ["gsplat"]

[pypi-dependencies]
plyfile = "*"
tensorboard = "*"
tqdm = "*"
einops = "*"
wandb = "*"
lpips = "*"
laspy = "*"
jaxtyping = "*"
colorama = "*"
opencv-python = "*"
scikit-learn = "*"
gsplat = { git = "https://github.com/tongji-rkr/gsplat-2dgs.git" }
open3d = ">=0.18.0, <0.19"
kornia = ">=0.7.3, <0.8"
