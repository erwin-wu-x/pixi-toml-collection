[workspace]
authors = ["erwin wu <wsxerwin@gmail.com>"]
channels = ["nvidia/label/cuda-12.4.0", "nvidia", "conda-forge", "pytorch"]
name = "STDLoc"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
simple-knn-install = "proxychains pip install submodules/simple-knn"
gsplat-install = "proxychains pip install submodules/gsplat" #git checkout main
detactron2-install = "proxychains pip install 'git+https://github.com/facebookresearch/detectron2.git'"
Mask2Former-install = "cd submodules/Mask2Former/mask2former/modeling/pixel_decoder/ops && sh make.sh"
Mask2Former-download = "cd submodules/Mask2Former/ && wget https://dl.fbaipublicfiles.com/maskformer/mask2former/coco/panoptic/maskformer2_swin_large_IN21k_384_bs16_100ep/model_final_f07440.pkl"

[dependencies]
cuda = {version = "*", channel="nvidia/label/cuda-12.4.0"}
pytorch = {version = "2.4.0.*", channel="pytorch"}
torchvision = {version = "0.19.0.*", channel="pytorch"}
torchaudio = {version = "2.4.0.*", channel="pytorch"}
pytorch-cuda = {version = "12.4.*", channel="pytorch"}
python = "3.9.*"
rerun-sdk = ">=0.23.3,<0.24"
opencv = ">=4.10.0,<5"
openai-clip = ">=1.0.1,<2"
pip = ">=25.1.1,<26"
compilers = ">=1.9.0,<2"
plyfile = ">=1.1,<2"
matplotlib = ">=3.9.4,<4"
scikit-learn = ">=1.6.1,<2"
poselib = ">=2.0.4,<3"
pyyaml = ">=6.0.2,<7"
tqdm = ">=4.67.1,<5"
trimesh = ">=4.6.12,<5"
utm = ">=0.7.0,<0.8"

