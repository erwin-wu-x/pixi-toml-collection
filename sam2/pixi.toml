[project]
channels = ["nvidia/label/cuda-12.4.0", "nvidia", "conda-forge", "pytorch"]
name = "sam2"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
eva-decord-install = "proxychains pip install eva-decord"
opencv-install = "proxychains pip install 'opencv-python>=4.7.0'"
sam2-install = "proxychains pip install -e '.[notebooks]'"

[dependencies]
cuda = {version = "*", channel="nvidia/label/cuda-12.4.0"}
pytorch = {version = "2.5.1.*", channel="pytorch"}
torchvision = {version = "0.20.1.*", channel="pytorch"}
torchaudio = {version = "2.5.1.*", channel="pytorch"}
pytorch-cuda = {version = "12.4.*", channel="pytorch"}
python = ">=3.10.0"
pip = ">=25.0.1,<26"
matplotlib = ">=3.10.1,<4"
jupyter = ">=1.1.1,<2"
iopath = ">=0.1.10,<0.2"
tqdm = ">=4.67.1,<5"
hydra-core = ">=1.3.2,<2"
pillow = ">=9.4.0"
ffmpeg = ">=4.4.2,<5"
