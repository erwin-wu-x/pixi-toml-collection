[workspace]
channels = ["nvidia/label/cuda-11.8.0", "nvidia", "conda-forge", "pytorch",]
name = "AnySplat"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
pip-install = "proxychains4 pip install xformers==0.0.24 torch_scatter==2.1.2"
lightning-install = "proxychains4 pip install lightning"
pytorch3d-install = "proxychains4 pip install 'git+https://github.com/facebookresearch/pytorch3d.git'"
gsplat-install = "proxychains4 pip install 'https://github.com/nerfstudio-project/gsplat/releases/download/v1.4.0/gsplat-1.4.0%2Bpt22cu121-cp310-cp310-linux_x86_64.whl'"

[dependencies]
cuda = {version = "*", channel="nvidia/label/cuda-11.8.0"}
pytorch = {version = "2.2.0.*", channel="pytorch"}
torchvision = {version = "0.17.0.*", channel="pytorch"}
torchaudio = {version = "2.2.0.*", channel="pytorch"}
pytorch-cuda = {version = "11.8.*", channel="pytorch"}
python = "3.10.*"
tqdm = ">=4.67.1,<5"
wandb = ">=0.22.0,<0.23"
colorama = ">=0.4.6,<0.5"
scikit-image = ">=0.25.2,<0.26"
matplotlib = ">=3.10.6,<4"
colorspacious = ">=1.1.2,<2"
moviepy = ">=1.0.3,<2"
imageio = ">=2.37.0,<3"
timm = ">=1.0.20,<2"
dacite = ">=1.9.2,<2"
plyfile = ">=1.1,<2"
e3nn = ">=0.5.7,<0.6"
tabulate = ">=0.9.0,<0.10"
huggingface_hub = ">=0.35.2,<0.36"
opencv = ">=4.12.0,<5"
pillow = ">=11.3.0,<12"
gradio = ">=5.47.1,<6"
open3d = ">=0.19.0,<0.20"
safetensors = ">=0.6.2,<0.7"
pip = "*"
compilers = "==1.5.0"
scikit-video = ">=1.1.11,<2"
numpy = "==1.25.0"
einops = ">=0.8.1,<0.9"
omegaconf = ">=2.3.0,<3"
