[project]
name = "cpp-dev"
version = "0.1.0"
description = "C++ development environment"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
cmake = "*"
ninja = "*"
cxx-compiler = "*"
gdb = "*"

[tasks]
configure = "cmake -B build -G Ninja"
build = "cmake --build build"
test = "ctest --test-dir build"
clean = "rm -rf build"

[feature.dev.dependencies]
clang-format = "*"
clang-tools = "*"
cppcheck = "*"

[feature.dev.tasks]
format = "clang-format -i src/**/*.cpp src/**/*.h"
lint = "cppcheck --enable=all src/"

[environments]
default = ["dev"]
